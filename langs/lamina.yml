# langs/lamina.yml
name: "Lamina"
platform: "linux"
file_extension: ".lm"
setup_commands:
  - "sudo apt-get install -y cmake nasm build-essential git"
  - "git clone https://github.com/geguj/Lamina1 /tmp/lamina && cd /tmp/lamina"
  - "ls /tmp/lamina"
  - "cmake -B build -DUSE_ASM=ON -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel"
run_command: "/tmp/lamina/build/lamina {sources}"
version_command: "echo undefined"
